name: Track watchlist prices

on:
  schedule:
    # twice a day (06:17 and 18:17 UTC); off the hour to avoid the cron rush
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: Google searches per watch
        default: "12"

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Run tracker
        working-directory: engine
        env:
          FLIGHTSCOUT_API_URL: ${{ secrets.FLIGHTSCOUT_API_URL }}
          FLIGHTSCOUT_TRACKER_KEY: ${{ secrets.FLIGHTSCOUT_TRACKER_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FLIGHTSCOUT_SKY_KEYS: ${{ secrets.FLIGHTSCOUT_SKY_KEYS }}
          FLIGHTSCOUT_VIVA_KEY: ${{ secrets.FLIGHTSCOUT_VIVA_KEY }}
          FLIGHTSCOUT_VOLOTEA_KEY: ${{ secrets.FLIGHTSCOUT_VOLOTEA_KEY }}
          FLIGHTSCOUT_CACHE: ${{ runner.temp }}/fs-cache
        run: |
          uv run --extra browser playwright install --with-deps chromium
          uv run --extra browser flightscout track -v --budget ${{ inputs.budget || '12' }}
