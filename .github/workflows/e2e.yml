name: Live checks

# Nightly against the live site and real flight sources, plus on demand.
# Catches sources breaking (a scraper stops working) and UI regressions.
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

jobs:
  engine-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Browser for the Google Cheapest tab check
        working-directory: engine
        run: uv run --extra browser playwright install --with-deps chromium chrome
      - name: Live source tests (incl. coverage of Google's Cheapest tab)
        working-directory: engine
        env:
          FLIGHTSCOUT_LIVE: "1"
        run: uv run --extra browser pytest -q -m live

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the live site
        env:
          E2E_BASE_URL: ${{ secrets.FLIGHTSCOUT_API_URL }}
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
