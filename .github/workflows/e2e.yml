name: Live checks

# Nightly against the live site and real flight sources, plus on demand.
# Catches sources breaking (a scraper stops working) and UI regressions. A
# live source that fails once (after a retry) is a warning in the run summary;
# failing two runs in a row turns the engine-live job red. That job can't fail
# the run (continue-on-error), so a flaky airline site sends no failure email;
# a broken live site (the site job) still does.
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only the live engine tests matching this pytest -k expression (skips the site tests)"
        required: false
        default: ""

jobs:
  engine-live:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Browser for the Google Cheapest tab check
        working-directory: engine
        run: uv run --extra browser playwright install --with-deps chromium chrome
      # Which live tests failed last run (see tests/conftest.py): a test fails
      # the run only when it failed the run before too. Each run saves its own.
      - name: Last run's live failures
        uses: actions/cache/restore@v6
        with:
          path: engine/.live-failures.json
          key: live-failures-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-failures-
      - name: Live source tests (incl. coverage of Google's Cheapest tab)
        working-directory: engine
        env:
          FLIGHTSCOUT_LIVE: "1"
          FLIGHTSCOUT_LIVE_STATE: .live-failures.json
          ONLY: ${{ inputs.only }}
        run: uv run --extra browser pytest -q -m live --reruns 1 --reruns-delay 30 ${ONLY:+-k "$ONLY"}
      # a run of only some tests would forget the others' failures
      - name: Save this run's live failures
        if: always() && !inputs.only
        uses: actions/cache/save@v6
        with:
          path: engine/.live-failures.json
          key: live-failures-${{ github.run_id }}-${{ github.run_attempt }}

  site:
    if: ${{ !inputs.only }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the live site
        env:
          E2E_BASE_URL: ${{ secrets.FLIGHTSCOUT_API_URL }}
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()  # also the traces of flaky tests (a failed first try that passed on retry)
        with:
          name: playwright-traces
          path: /tmp/flightscout-e2e  # playwright.config.ts outputDir (os.tmpdir())
          if-no-files-found: ignore
